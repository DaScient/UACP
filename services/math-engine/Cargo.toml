[package]
name        = "uacp-math-engine"
version     = "0.1.0"
edition     = "2021"
description = "High-performance UAP math engine: multi-station ECEF parallax intersection."
license     = "MIT"
repository  = "https://github.com/DaScient/UACP"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm    = ["wasm-bindgen", "serde-wasm-bindgen", "serde"]

[dependencies]
wasm-bindgen        = { version = "0.2", optional = true }
serde               = { version = "1", optional = true, features = ["derive"] }
serde-wasm-bindgen  = { version = "0.6", optional = true }

[dev-dependencies]
approx = "0.5"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
